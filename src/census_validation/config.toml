# ─────────────────────────────────────────────────────────────────────────────
# Configuration for the census_validation package.
#
# Relative paths resolve against this file's directory (src/census_validation/),
# so ../../ points at the project root's data/ and logs/ folders. Absolute paths
# are used as-is. Override the config location with the
# WFAI_RECORD_VALIDATION_CONFIG environment variable.
# ─────────────────────────────────────────────────────────────────────────────

[schema]
# Columns the file must contain. Order does not matter and extra columns are
# allowed (kept in the output, flagged with a warning); if any of these columns
# is missing, the file cannot be validated per record and is rejected wholesale.
expected_columns = ["Type", "Facility", "Unit", "VolDate", "VolHour", "Volume"]
# Columns that must not be empty/null in any record.
required_columns = ["Type", "Facility", "Unit", "VolDate", "VolHour", "Volume"]
# Columns whose combination identifies a duplicate record. Rows sharing these
# values are duplicates; among otherwise-valid duplicates the highest-Volume row
# is kept and the rest are rejected with the reason "duplicate value".
dup_keys = ["Type", "Facility", "Unit", "VolDate", "VolHour"]

[rules]
# VolHour must be an integer within [min_hour, max_hour] inclusive.
min_hour = 0
max_hour = 23
# Volume must be an integer >= min_volume.
min_volume = 0
# When true, unit names must match valid_units_file exactly (case-sensitive).
case_sensitive_units = true

[paths]
# Default file validated when no path is passed on the CLI.
default_file = "../../data/test/test_record_mix.csv"
# Root under which per-file log folders are created.
log_root = "../../logs"
# Rows that pass every check are routed here.
accepted_dir = "../../data/successful_data"
# Rows that fail one or more checks are routed here.
rejected_dir = "../../data/rejected_data"
# Aggregated rejection reports (one row per Unit + error type) are written here.
rejected_summary_dir = "../../data/rejected_summary"
# Bootstrap list of valid/known units (a .txt with one unit per line, or a .csv
# with a "Unit" column). Units not in this list are rejected.
valid_units_file = "../../data/valid_units.txt"

[behavior]
# When true, validated records are written out (passing -> accepted_dir, failing
# -> rejected_dir with a reason column). When false, the run only logs a summary.
route_validated_files = true
# Name of the column appended to rejected records explaining why they failed.
rejection_reason_column = "RejectionReason"
# When true, also write an aggregated rejection report to rejected_summary_dir.
write_rejection_summary = true
# When true, run the duplicate check (CHECK 5): among rows sharing dup_keys, keep
# the highest-Volume row and reject the rest as "duplicate value".
check_duplicates = true
# Name of the single timestamp column written to the output files. On output,
# VolDate and VolHour are combined into this column ("YYYY-MM-DDTHH:00:00Z") and
# the original VolDate/VolHour columns are dropped.
timestamp_column = "VolTimestamp"

[dynamo]
# When true, also emit DynamoDB-shaped JSON (a Files META item and one Validation
# Errors item per record-level error), matching dynamo_schema.md.
write_dynamo_output = true
# Directory the DynamoDB-shaped JSON files are written to.
dynamo_dir = "../../data/dynamo"
# Tenant/org identifier stamped onto the file item (not derivable from the CSV).
org_id = "unknown"
# file_type stamped onto the file item.
file_type = "CENSUS"

[logging]
format = "%(asctime)s  %(levelname)-8s  %(message)s"
datefmt = "%Y-%m-%d %H:%M:%S"
